<main class="container">
    <section class="page-heading">
        <h1>احجز موعدك الآن</h1>
        <p>يسعدنا اختيارك لعيادة ابتسامة لطب الأسنان</p>
    </section>

    <div class="booking-layout">

        <form id="bookingForm" class="form-box">
            <h2>بيانات الحجز</h2>

            <div class="form-grid">

                <div class="form-group">
                    <label for="patientName">اسم المريض</label>
                    <input type="text" id="patientName"
                           placeholder="اكتب الاسم بالكامل" required>
                </div>

                <div class="form-group">
                    <label for="phone">رقم الهاتف</label>
                    <input type="tel" id="phone"
                           placeholder="01xxxxxxxxx" required>
                </div>

                <div class="form-group">
                    <label for="specialty">نوع الخدمة</label>
                    <select id="specialty" required>
                        <option value="">اختر الخدمة</option>
                        <option value="كشف أسنان">كشف أسنان - 200 جنيه</option>
                        <option value="تنظيف الأسنان">تنظيف الأسنان - 350 جنيه</option>
                        <option value="تبييض الأسنان">تبييض الأسنان - 1200 جنيه</option>
                        <option value="تقويم الأسنان">تقويم الأسنان - 1500 جنيه</option>
                        <option value="حشو الأسنان">حشو الأسنان - 500 جنيه</option>
                        <option value="خلع الأسنان">خلع الأسنان - 400 جنيه</option>
                        <option value="زراعة الأسنان">زراعة الأسنان - 5000 جنيه</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="clinic">العيادة</label>
                    <select id="clinic" required>
                        <option value="">اختر العيادة</option>
                        <option value="العيادة الرئيسية">عيادة ميدان المسلة برج الأطباء</option>
                        <option value="عيادة فرع المدينة">عيادة 6 أكتوبر بالفردوس</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">تاريخ الحجز</label>
                    <input type="date" id="date" required>
                </div>

                <div class="form-group">
                    <label for="time">وقت الحجز</label>
                    <select id="time" required>
                        <option value="">اختر الوقت</option>
                        <option value="10:00 صباحًا">10:00 صباحًا</option>
                        <option value="11:00 صباحًا">11:00 صباحًا</option>
                        <option value="12:00 ظهرًا">12:00 ظهرًا</option>
                        <option value="02:00 مساءً">02:00 مساءً</option>
                        <option value="03:00 مساءً">03:00 مساءً</option>
                        <option value="04:00 مساءً">04:00 مساءً</option>
                        <option value="05:00 مساءً">05:00 مساءً</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label for="reason">سبب الزيارة (اختياري)</label>
                    <textarea id="reason"
                              placeholder="اكتب تفاصيل إضافية إن وجدت"></textarea>
                </div>

            </div>

            <button type="submit">الانتقال إلى الدفع</button>
            <p id="bookingMessage" class="form-message"></p>
        </form>

        <aside class="summary-box">
            <h2>ملخص الحجز</h2>

            <p>اسم المريض <span id="sumName">---</span></p>
            <p>الخدمة <span id="sumSpecialty">---</span></p>
            <p>العيادة <span id="sumClinic">---</span></p>
            <p>التاريخ <span id="sumDate">---</span></p>
            <p>الوقت <span id="sumTime">---</span></p>

            <hr>

            <h3>الإجمالي <span id="sumPrice">0 جنيه</span></h3>
        </aside>

    </div>
